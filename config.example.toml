# Copy this file to config.toml and fill in your own values.
# Single account: fill in username/password below and leave [[accounts]] commented out.
username = "your-account"
password = "your-password"
# Seconds between round starts, minimum 10. Restart after editing.
check_interval = 30
# true: log every course status and save redacted HTTP captures under logs/debug/.
debug = false
# Optional GCJ-02 location for SIMPLE / POINT_9 check-ins, written as
# "longitude,latitude" exactly like map pickers copy it.
# location = "121.482388,29.885685"

# Per-course overrides for SIMPLE / POINT_9 check-ins. Repeat the block as needed.
# Each block selects exactly one course by course_id or course name.
# [[locations]]
# course = "算法设计与分析"
# location = "121.482388,29.885685"
#
# [[locations]]
# course_id = "F9CF052C-AD94-11F1-BAE9-A088C2A30E68"
# location = "120.160000,30.280000"

# Multi-account: repeat the block for every account, and comment out the single
# username/password above. The two styles cannot be mixed.
# name is only a label in the console; defaults to 账号1, 账号2, ...
# Each account may set its own location, overriding the global one.
# [[accounts]]
# name = "主账号"
# username = "account-1"
# password = "password-1"
#
# [[accounts]]
# name = "小号"
# username = "account-2"
# password = "password-2"
# location = "121.473701,31.230416"
#
# # Per-course overrides inside an account. These win over the global [[locations]].
# [[accounts.locations]]
# course = "算法设计与分析"
# location = "121.000000,31.000000"
