# Copy this file to config.toml and fill in your own values.
# Restart the program after editing.
#
# Seconds between round starts, minimum 10.
check_interval = 30
# true: log every course status and save redacted HTTP captures under logs/debug/.
debug = false

# Accounts. Repeat this block for every account; a single account is just one block.
# Every block needs username and password.
# name only labels console/log output; defaults to 账号1, 账号2, ...
# location is "longitude,latitude" in GCJ-02 (高德/腾讯地图), exactly as map
# pickers copy it. It is optional.

[[accounts]]
name = "主账号"
username = "account-1"
password = "password-1"
# location = "121.482388,29.885685"

# Per-course location overrides inside an account. Repeat as needed.
# Each block selects exactly one course by course_id or course name.
# [[accounts.locations]]
# course = "算法设计与分析"
# location = "121.482388,29.885685"
#
# [[accounts.locations]]
# course_id = "F9CF052C-AD94-11F1-BAE9-A088C2A30E68"
# location = "120.160000,30.280000"

