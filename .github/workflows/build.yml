name: Build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew clean test build --no-daemon --stacktrace

      - name: Verify jar
        run: |
          test -f build/libs/autosign.jar
          java -jar build/libs/autosign.jar --version

      # upload-artifact 以所有路径的最近公共祖先作为 artifact 根目录，
      # 直接上传 build/libs/autosign.jar + config.example.toml 会保留 build/libs/ 层级，
      # 导致 release job 里找不到 autosign.jar。先统一摊平到 dist/。
      - name: Stage release files
        run: |
          mkdir -p dist
          cp build/libs/autosign.jar dist/
          cp config.example.toml dist/

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: autosign-jar
          path: dist/
          if-no-files-found: error

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore

  release:
    name: Attach jar to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: read

    steps:
      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: autosign-jar

      - name: List release files
        run: ls -l

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            autosign.jar
            config.example.toml
          fail_on_unmatched_files: true
          generate_release_notes: true
